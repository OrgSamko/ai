name: FNOK Chat iPhone

on:
  workflow_dispatch:
    inputs:
      signed_ipa:
        description: Export a signed IPA for registered iPhones
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build for iPhone simulator
        if: ${{ !inputs.signed_ipa }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project FnokChatIOS/FnokChat.xcodeproj -scheme FnokChat \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/simulator" CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/simulator/Build/Products/Release-iphonesimulator/FnokChat.app" \
            "$RUNNER_TEMP/FnokChat-Simulator.zip"

      - name: Upload simulator build
        if: ${{ !inputs.signed_ipa }}
        uses: actions/upload-artifact@v7
        with:
          name: FnokChat-Simulator
          path: ${{ runner.temp }}/FnokChat-Simulator.zip
          if-no-files-found: error

      - name: Sign and export iPhone IPA
        if: ${{ inputs.signed_ipa }}
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          : "${IOS_CERTIFICATE_BASE64:?Set the IOS_CERTIFICATE_BASE64 secret}"
          : "${IOS_CERTIFICATE_PASSWORD:?Set the IOS_CERTIFICATE_PASSWORD secret}"
          : "${IOS_PROFILE_BASE64:?Set the IOS_PROFILE_BASE64 secret}"
          xcodebuild -version
          signing_dir="$(mktemp -d "$RUNNER_TEMP/fnok-signing.XXXXXX")"
          keychain="$signing_dir/signing.keychain-db"
          profile_path=""
          cleanup() {
            if [[ -n "$profile_path" ]]; then rm -f "$profile_path"; fi
            security delete-keychain "$keychain" 2>/dev/null || true
            rm -rf "$signing_dir"
          }
          trap cleanup EXIT

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$signing_dir/distribution.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 -D > "$signing_dir/profile.mobileprovision"
          security cms -D -i "$signing_dir/profile.mobileprovision" > "$signing_dir/profile.plist"
          python3 - "$signing_dir" <<'PY'
          import pathlib
          import plistlib
          import sys
          import uuid

          folder = pathlib.Path(sys.argv[1])
          with (folder / "profile.plist").open("rb") as source:
              profile = plistlib.load(source)
          team = profile["TeamIdentifier"][0]
          profile_uuid = str(uuid.UUID(profile["UUID"])).upper()
          app_id = profile["Entitlements"]["application-identifier"]
          prefix, bundle = app_id.split(".", 1)
          if (prefix not in profile["ApplicationIdentifierPrefix"] or "*" in bundle
                  or "iOS" not in profile["Platform"] or not profile.get("ProvisionedDevices")
                  or profile["Entitlements"].get("get-task-allow")):
              sys.exit("Use an iOS Ad Hoc profile for an explicit App ID and registered iPhones.")
          with (folder / "ExportOptions.plist").open("wb") as destination:
              plistlib.dump({
                  "method": "release-testing",
                  "destination": "export",
                  "signingStyle": "manual",
                  "signingCertificate": "Apple Distribution",
                  "teamID": team,
                  "provisioningProfiles": {bundle: profile_uuid},
              }, destination)
          (folder / "signing-settings").write_text(f"{team}\n{bundle}\n{profile_uuid}\n")
          PY
          {
            read -r team_id
            read -r bundle_id
            read -r profile_uuid
          } < "$signing_dir/signing-settings"

          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/distribution.p12" -k "$keychain" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep 'Apple Distribution:'

          profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir"
          profile_path="$profile_dir/$profile_uuid.mobileprovision"
          cp "$signing_dir/profile.mobileprovision" "$profile_path"

          xcodebuild -project FnokChatIOS/FnokChat.xcodeproj -scheme FnokChat \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FnokChat.xcarchive" archive \
            "DEVELOPMENT_TEAM=$team_id" "PRODUCT_BUNDLE_IDENTIFIER=$bundle_id" \
            "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Apple Distribution" \
            "PROVISIONING_PROFILE_SPECIFIER=$profile_uuid"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FnokChat.xcarchive" \
            -exportOptionsPlist "$signing_dir/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa"
          test -f "$RUNNER_TEMP/ipa/FnokChat.ipa"

      - name: Upload signed IPA
        if: ${{ inputs.signed_ipa }}
        uses: actions/upload-artifact@v7
        with:
          name: FnokChat-iPhone-IPA
          path: ${{ runner.temp }}/ipa/FnokChat.ipa
          if-no-files-found: error
